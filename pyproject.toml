[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-booking-scraper"
version = "0.1.0"
description = "Booking scraper for Python and the command line: Booking.com hotels and apartments around a city or street address for your dates, with stay price, price per night, discount, review score, stars, distance and free-cancellation flag, as JSON or CSV. Free and open source; sign in with your QuanticData account, no proxies or headless browser to run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["booking-scraper", "booking-com", "booking-com-scraper", "booking-api", "hotel-scraper", "hotel-prices", "hotel-data", "hotel-rates", "rate-shopping", "travel-data", "web-scraping", "scraper"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
booking-scraper = "quanticdata_booking_scraper.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/booking-com-scraper-api/?utm_source=github&utm_medium=pypi&utm_campaign=booking-scraper"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/booking-scraper"
Issues = "https://github.com/quantumproxies/booking-scraper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_booking_scraper" = ["spec.json", "py.typed"]
